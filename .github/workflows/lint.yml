name: Lint
on:
  push:
    branches:
      - main
      - canary
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    timeout-minutes: 20
    runs-on: depot-ubuntu-22.04-2
    container:
      image: node:24-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 1
      - name: pnpm setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Lint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: true
