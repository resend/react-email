name: Release
on:
  push:
    branches:
      - main
      - canary
permissions:
  contents: read
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  release:
    # npm trusted publishing (OIDC) is only supported on GitHub-hosted `ubuntu-latest` runners.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: 
      id-token: write
      contents: write
    container:
      image: node:24@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 1
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: pnpm setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Publish release
        run: pnpm release
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
